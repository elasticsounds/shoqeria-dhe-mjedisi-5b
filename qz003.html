<script data-adt-runtime-adapter="accepted-reader-controls">(function(){
  if(window.__pdfRepairInstalled) return;
  window.__pdfRepairInstalled=true;
  // Preserve native radios and the runtime's event handlers; remove duplicate label roles.
  var scheduled=false;
  function normalizeQuizSemantics(){
    scheduled=false;
    document.querySelectorAll('section[data-section-type="activity_quiz"]').forEach(function(section){
      if(section.getAttribute('role')!=='group') section.setAttribute('role','group');
      var group=section.querySelector('.quiz-body [aria-labelledby]');
      if(group && group.getAttribute('role')!=='radiogroup') group.setAttribute('role','radiogroup');
      section.querySelectorAll('label.activity-option').forEach(function(option){
        ['role','tabindex','aria-checked'].forEach(function(name){if(option.hasAttribute(name))option.removeAttribute(name);});
        var radio=option.querySelector('input[type=radio]');
        if(radio){
          if(radio.getAttribute('tabindex')!=='0')radio.setAttribute('tabindex','0');
          if(radio.hasAttribute('aria-hidden'))radio.removeAttribute('aria-hidden');
        }
      });
    });
  }
  function schedule(){
    if(scheduled)return;
    scheduled=true;requestAnimationFrame(normalizeQuizSemantics);
  }
  new MutationObserver(schedule).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['role','tabindex','aria-checked']});
  document.addEventListener('adt:translations-applied',schedule);
  schedule();
  document.addEventListener('click',function(event){
    var button=event.target.closest('[data-pdf-reset-responses]');
    if(!button) return;
    var section=button.closest('[data-section-id]');
    if(!section) return;
    var sectionId=section.dataset.sectionId;
    // Clear only this section's response keys, then let the native runtime reinitialize.
    Object.keys(localStorage).forEach(function(key){
      if(key.indexOf(sectionId+'_')===0) localStorage.removeItem(key);
    });

    location.reload();
  });
})();
</script>
