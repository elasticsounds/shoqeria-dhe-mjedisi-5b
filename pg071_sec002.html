  document.addEventListener('change',function(e){var el=e.target;if(!el.matches('[data-fb-response]')||!section(el))return;save(el,el.dataset.fbResponse,el.type==='checkbox'?el.checked:el.value);});
  document.addEventListener('click',function(e){
    var btn=e.target.closest('button');if(!btn||!section(btn))return;var s=section(btn);
    if(btn.matches('[data-check-answers]')) {
      var incorrect=checkChoices(s);
      reveal(incorrect[0] || s.querySelector('.fb-feedback'));
    }
    if(btn.matches('[data-reset-section]')) {
      var keys=new Set();
      s.querySelectorAll('[data-fb-response],[data-drawing]').forEach(function(el){
        keys.add(storageKey(el,el.dataset.fbResponse || el.dataset.drawing));
      });
      var cleared=true;
      keys.forEach(function(key){
        delete memory[key];
        try {localStorage.removeItem(key);}catch(e){cleared=false;}
      });
      s.querySelectorAll('[data-fb-response]').forEach(function(el){if(el.type==='checkbox'||el.type==='radio')el.checked=false;else el.value='';});
      s.querySelectorAll('canvas').forEach(function(c){var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);});
      s.querySelectorAll('.fb-feedback').forEach(function(el){el.textContent='';});
      s.querySelector('[data-workbook-feedback]').textContent='';
      var status=s.querySelector('[data-save-status]');if(status)status.textContent=msg('saved');
      // The reader owns the Submit/Next state. Reload after clearing this
      // slide so a completed worksheet can be attempted again.
      if(cleared && s.dataset.fbCompleted==='true')location.reload();
    }
  });
  document.addEventListener('adt:page-changed',initialize);
  document.addEventListener('adt:translations-applied',function(){initialize();document.querySelectorAll('[data-fullbook] .fb-feedback').forEach(function(el){el.textContent='';});});
  function register(s) {
    if(!s || !s.dataset.sectionType.startsWith('activity_custom_') || s.dataset.fbRegistered) return;
    s.dataset.fbRegistered='true';
    if(!window.adtRegisterCustomActivity){window.__adtPendingCustomActivities=window.__adtPendingCustomActivities||[];window.adtRegisterCustomActivity=function(section,handlers){window.__adtPendingCustomActivities.push({section:section,handlers:handlers});};}
    window.adtRegisterCustomActivity(s,{
      validate:function(){
        var graded=s.querySelectorAll('select[data-correct],fieldset[data-choice]');
        var incorrect=checkChoices(s);
        var answers=Array.from(s.querySelectorAll('textarea,input[type=text],input[type=number],select:not([data-correct])'));
        var unanswered=answers.find(function(el){return !isAnswered(el);});
        var confirmation=s.querySelector('[data-fb-confirm]');
        var completed=!unanswered;
        if(confirmation)completed=completed && confirmation.checked;
        else if(!graded.length&&!answers.length)completed=!!s.querySelector('input:checked');
        var status=s.querySelector('[data-workbook-feedback]');
        status.textContent=msg(!completed?'incomplete':incorrect.length?'incorrect':graded.length&&!answers.length?'correct':'review');
        reveal(unanswered || (confirmation && !confirmation.checked ? confirmation : null) || incorrect[0] || status);
        s.dataset.fbCompleted=String(!incorrect.length&&completed);
        return !incorrect.length&&completed;
      },
      reset:function(){var button=s.querySelector('[data-reset-section]');if(button)button.click();}
    });
  }
  window.__fiveBFullBook={initialize:initialize,register:register};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initialize);else initialize();
  initialize();register(document.querySelector('section[data-fullbook]'));
